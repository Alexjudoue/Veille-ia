name: Veille quotidienne

on:
  schedule:
    - cron: "45 5 * * 1-5"   # du lundi au vendredi, 5h45 UTC (7h45 à Paris en été)
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write             # pour sauvegarder le brief et la mémoire dans le dépôt

jobs:
  veille:
    timeout-minutes: 20         # garde-fou : l'agent lit des pages web, on évite une exécution qui s'éternise
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: pytest -q

      - name: Générer le brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --send

      - name: Sauvegarder le brief et la mémoire
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add briefs/ data/
          git diff --cached --quiet || git commit -m "Brief du $(date +%F)"
          git push
